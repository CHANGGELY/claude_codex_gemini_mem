name: Security deps update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Override vulnerable packages to latest
        run: |
          node -e '
          const fs = require("fs");
          const { execSync } = require("child_process");
          const pkgs = "handlebars,hono,@hono/node-server,@modelcontextprotocol/sdk,ajv,fast-uri,minimatch,path-to-regexp,qs,yaml,body-parser,@isaacs/brace-expansion".split(",").map(s => s.trim()).filter(Boolean);
          const pj = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pj.overrides = pj.overrides || {};
          for (const p of pkgs) {
            let v;
            try { v = JSON.parse(execSync(`npm view ${JSON.stringify(p)} version --json`).toString().trim()); }
            catch (e) { console.log("skip", p); continue; }
            const range = "^" + v;
            if (pj.dependencies && pj.dependencies[p] !== undefined) { pj.dependencies[p] = range; }
            else if (pj.devDependencies && pj.devDependencies[p] !== undefined) { pj.devDependencies[p] = range; }
            else { pj.overrides[p] = range; }
          }
          fs.writeFileSync("package.json", JSON.stringify(pj, null, 2) + "\n");
          console.log("overrides written:", Object.keys(pj.overrides).join(", "));
          '
      - name: Regenerate lockfile
        run: npm install --package-lock-only
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "security(deps): vulnerable packages overridden to latest, lockfile regenerated" && git push)
