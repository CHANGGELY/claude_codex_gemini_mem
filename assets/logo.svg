<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium "Dark Chrome" Aesthetic -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0E0E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9E9E9E;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background Circle (Sleek Dark) -->
  <circle cx="100" cy="100" r="95" fill="url(#chromeGrad)" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  
  <!-- Central Neural Core -->
  <g filter="url(#softGlow)">
    <!-- Hexagon Grid (Tech feel) -->
    <path d="M100 60 L134.6 80 L134.6 120 L100 140 L65.4 120 L65.4 80 Z" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.5" />
    
    <!-- Central Node -->
    <circle cx="100" cy="100" r="12" fill="url(#accentGrad)" />
    
    <!-- Peripheral "Memory" Nodes -->
    <circle cx="100" cy="75" r="5" fill="#FFFFFF" />
    <circle cx="125" cy="112" r="5" fill="#BDBDBD" />
    <circle cx="75" cy="112" r="5" fill="#BDBDBD" />
    
    <!-- Connecting Fibers -->
    <line x1="100" y1="80" x2="100" y2="95" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="120" y1="110" x2="110" y2="105" stroke="#BDBDBD" stroke-width="1" />
    <line x1="80" y1="110" x2="90" y2="105" stroke="#BDBDBD" stroke-width="1" />
  </g>
  
  <!-- Subtle Prompt Identifier -->
  <text x="100" y="102" font-family="SF Pro Display, Inter, system-ui" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle" dominant-baseline="middle">M</text>
  
  <!-- Project Name Initial -->
  <text x="100" y="165" font-family="SF Pro Display, Inter, system-ui" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle" letter-spacing="2">MEM</text>
</svg>
